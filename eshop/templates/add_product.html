{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                {%if form.instance.id%}
                <h2 class="text-center text-danger">Update Product</h2>
                {%else%}
                <h2 class="text-center text-warning">Add Product</h2>
                {%endif%}
                <form method="POST" class="card p-3 shadow" enctype="multipart/form-data">
                    {%csrf_token%}
                    {{form.as_p}}
                    <button class="btn btn-warning" type="submit">
                    {%if form.instance.id%}UPDATE PRODUCT{%else%}ADD PRODUCT{%endif%}</button>
                </form>
            </div>
        </div>
        </div>
{%endblock%}
