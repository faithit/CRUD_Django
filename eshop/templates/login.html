{% extends 'base.html' %}
{% block title %}Sign in | Eshop{% endblock %}
{% block content %}
<main class="register-page">
    <div class="container py-5">
        <div class="register-card">
            <div class="register-card-header">
                <div class="register-mark" aria-hidden="true">E</div>
                <span class="register-eyebrow">WELCOME BACK</span>
                <h1>Sign in to Eshop</h1>
                <p>Enter your details to access your account.</p>
            </div>

            <form method="post" class="register-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 register-submit">Sign in</button>
            </form>
            <p class="register-footnote">New to Eshop? <a href="{% url 'register' %}">Create an account</a></p>
        </div>
    </div>
</main>
{% endblock %}
