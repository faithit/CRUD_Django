{% extends 'base.html' %}
{% block title %}Create an account | Eshop{% endblock %}
{% block content %}
<main class="register-page">
    <div class="container py-5">
        <div class="register-card">
            <div class="register-card-header">
                <div class="register-mark" aria-hidden="true">E</div>
                <span class="register-eyebrow">JOIN OUR COMMUNITY</span>
                <h1>Create your account</h1>
                <p>Sign up to get started with Eshop.</p>
            </div>

            <form method="post" class="register-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 register-submit">Create account</button>
            </form>
            <p class="register-footnote">Your details are kept secure.</p>
        </div>
    </div>
</main>
{% endblock %}
